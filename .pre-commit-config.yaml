# Pre-commit hooks untuk proyek USDJPY Bot
# Install: pre-commit install
# Jalankan manual: pre-commit run --all-files

repos:
  # Formatting done entirely by ruff-format (black removed 2026-10-05).
  # Reason: one formatter only. Two formatters on the same files can
  # disagree and rewrite each other's output on every commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      # mixed-line-ending dihapus 2026-10-05. Hook itu memaksa LF ke semua
      # file dan berbalik mengubah .ps1 dari CRLF ke LF, menabrak aturan
      # `*.ps1 text eol=crlf` di .gitattributes. Satu sumber kebenaran saja.

  - repo: local
    hooks:
      - id: check-state-updated
        name: Cek STATE.md diupdate hari ini
        entry: python scripts/check_state.py
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-quick
        name: Pytest (quick)
        entry: python scripts/run_tests.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-foreign-chars
        name: Cek karakter asing (CJK, Cyrillic, Arab, dll)
        entry: python scripts/check_foreign_chars.py
        language: system
        pass_filenames: true
        files: \.(py|ya?ml|md|ps1|toml|csv|txt)$
