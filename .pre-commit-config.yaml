# Pre-commit hooks untuk proyek USDJPY Bot
# Install: pre-commit install
# Jalankan manual: pre-commit run --all-files

repos:
  # Formatting done entirely by ruff-format (black removed 2026-10-05).
  # Reason: one formatter only. Two formatters on the same files can
  # disagree and rewrite each other's output on every commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        # Notebook = artefak GENERATOR (sumbernya scripts/_build_eda*.py
        # yang tetap di-lint). Lint gaya di dalam JSON ipynb (E402/N816
        # di sel hasil-generate) memblokir setiap commit tanpa nilai.
        exclude: \.ipynb$
      - id: ruff-format
        exclude: \.ipynb$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      # mixed-line-ending dihapus 2026-10-05. Hook itu memaksa LF ke semua
      # file dan berbalik mengubah .ps1 dari CRLF ke LF, menabrak aturan
      # `*.ps1 text eol=crlf` di .gitattributes. Satu sumber kebenaran saja.

  - repo: local
    # Hook lokal lewat scripts/run_hook.bat supaya jalan dengan interpreter venv.
    # `python` dari PATH = Python 3.14 sistem (pandas 3.0.3) tanpa pyarrow,
    # sehingga 2 tes parquet selalu gagal meskipun kodenya benar.
    #
    # Bentuk entry `cmd /c "..." "..."` itu wajib, bukan hiasan:
    # pre-commit memecah entry dengan shlex.split() mode POSIX, yang memakan
    # garis miring terbalik. Path harus DIKUTIP agar backslash bertahan,
    # karena cmd.exe (bukan CreateProcess) yang me-resolve path relatif.
    # Penjelasan lengkap ada di komentar scripts/run_hook.bat.
    hooks:
      - id: check-state-updated
        name: Cek STATE.md diupdate hari ini
        entry: cmd /c "scripts\run_hook.bat" "scripts\check_state.py"
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-quick
        name: Pytest (quick)
        entry: cmd /c "scripts\run_hook.bat" "scripts\run_tests.py"
        language: system
        pass_filenames: false
        always_run: true
      - id: check-foreign-chars
        name: Cek karakter asing (CJK, Cyrillic, Arab, dll)
        entry: cmd /c "scripts\run_hook.bat" "scripts\check_foreign_chars.py"
        language: system
        pass_filenames: true
        files: \.(py|ya?ml|md|ps1|toml|csv|txt)$
