# Konfigurasi data & koneksi MT5
mt5:
  symbol: "USDJPY"
  # VERIFIED 2026-10-05: server Finex BUKAN offset tetap. Ia GMT+2 (EET) di
  # musim dingin dan GMT+3 (EEST) di musim panas, mengikuti DST Amerika.
  # Sumber: finex.co.id/trading/instruments ("GMT+2 ... selama Waktu Musim
  # Panas, waktu akan beralih ke GMT+3") + jawaban Finex Support 2026-10-05
  # yang menyebut tanggal persis per tahun. Kedelapan tanggal di bawah
  # diverifikasi ulang terhadap aturan DST AS (Minggu ke-2 Maret, Minggu
  # ke-1 November) dan 8 dari 8 cocok.
  #
  # Pengukuran langsung 5 Okt 2026: tick MT5 meleset +10.799 detik (= +3)
  # dari jam internet independen. Oktober masih sebelum 1 November, jadi
  # GMT+3 memang benar saat itu - konsisten, bukan pembuktian winter.
  #
  # Semua transisi jatuh di MINGGU saat pasar tutup: ketujuh tanggal di
  # bawah punya 0 bar, dan bar pertama sesudahnya selalu Senin. Jadi tidak
  # ada hari perdagangan yang terbelah antar offset, dan pencarian offset
  # berbasis tanggal eksak.
  broker_utc_offset_hours:
    standard: 2  # EET, musim dingin
    daylight: 3  # EEST, musim panas
  broker_dst_schedule:
    - {start: "2023-03-12", end: "2023-11-05"}
    - {start: "2024-03-10", end: "2024-11-03"}
    - {start: "2025-03-09", end: "2025-11-02"}
    - {start: "2026-03-08", end: "2026-11-01"}
  # Digit harga dari symbol_info().digits. Dipakai clean_data.py untuk
  # membulatkan OHLC ke presisi tick. USDJPY = 3 desimal.
  price_digits: 3
  timeframes:
    - M1
    - M5
    - M15
    - M30
    - H1
    - H4
    - D1
  start_date: "2023-01-01"
  end_date: "2026-10-05"
  login: ""
  password: ""
  server: ""

data:
  raw_format: "csv"
  processed_format: "parquet"
  filename_pattern: "{symbol}_{tf}_{year}.{format}"
  # Semua bar disimpan dalam UTC. Kolom broker_time_raw disimpan terpisah
  # supaya konversi bisa diaudit ulang tanpa fetch ulang (RULES.md §20).
  internal_timezone: "UTC"

# SPREAD CONFIG (WAJIB - section 18.16 RULES.md)
# Data OHLC MT5 = BID.
# BUY: entry ask = bid + spread, exit bid.
# SELL: entry bid, exit ask = bid + spread.
# Spread dalam PIP (bukan point).
spread:
  # ===================================================================
  # SEMANTIKA - BACA INI SEBELUM PAKAI (perubahan 2026-10-14)
  # ===================================================================
  # `default` dan `by_year` BUKAN biaya per trade. Semantikanya:
  # BASELINE VALIDASI untuk check_spread() di src/data/validate_data.py:277,
  # yang membandingkan p99 TERUKUR terhadap baseline x multiplier.
  #
  # Untuk menghitung BIAYA per trade, pakai `cost_basis` (mean) atau
  # `stress_bands` (p95/p99) di bawah - JANGAN pakai default/by_year.
  #
  # Sejarah nilai lama: default 1,5 / by_year 3,0+1,5+1,5+1,5. Angka itu
  # terlihat seperti "spread per trade" padahal 2,3x lebih mahal dari mean
  # terukur, dan tidak ada satu pun backtest yang memakainya sebagai biaya -
  # satu-satunya konsumennya adalah check_spread. Sekarang diganti mean
  # terukur stratum A dan multiplier dikalibrasi ulang.
  #
  # Konsumen `default`/`by_year` (hasil audit 2026-10-14):
  #   src/data/validate_data.py:277  -> check_spread, baseline p99
  # TIDAK ADA konsumen lain. fetch_data.py, build_features.py, dan
  # build_labels.py hanya membaca spread.pip_size (yang terpisah).
  # ===================================================================
  default: 0.65                # [TERUKUR] mean spread stratum A 2023-2026 = 0,6456
  by_year:                     # [TERUKUR] mean spread stratum A per tahun
    2023: 0.51                 #   mean aktual 0,5096  (H2 saja; H1 = stratum B)
    2024: 0.70                 #   mean aktual 0,7027
    2025: 0.67                 #   mean aktual 0,6738
    2026: 0.62                 #   mean aktual 0,6219
  # Kalau ini dipakai, spread harus dikalikan stress_multiplier.
  stress_multiplier: 2.0
  # check_spread membandingkan p99 terukur terhadap by_year di atas.
  # p99 > by_year x warn_multiplier  -> WARN
  # p99 > by_year x error_multiplier -> ERROR
  #
  # KALIBRASI ULANG 2026-10-14. Multiperlier lama (2,0/5,0) disetel ketika
  # baseline masih 1,5-3,0, jadi ambangnya longgar dan tidak pernah menangkap
  # apa pun. Dengan baseline mean, multiplier harus lebih longgar agar ambang
  # tidak lebih ketat dari ekor yang memang sudah diterima:
  #   2024 warn 0,70x3 = 2,10  vs p99 terukur 1,70 -> OK
  #   2025 warn 0,67x3 = 2,01  vs p99 terukur 1,70 -> OK
  #   2026 warn 0,62x3 = 1,86  vs p99 terukur 1,20 -> OK
  #   2023 ERROR 0,51x8 = 4,08 vs p99 terukur 8,50 -> ERROR (naik dari WARN)
  # Eskalasi 2023 itu BENAR dan diharapkan: p99-nya didominasi STRATA B
  # (H1-2023, regime SA-03) yang memang harus dipisahkan sebagai strata
  # tersendiri. Lihat catatan anomali di bagian bawah file ini.
  warn_multiplier: 3.0
  error_multiplier: 8.0
  # ===================================================================
  # [DEAD CONFIG] by_session dan by_news - TIDAK PERNAH DIBACA KODE
  # Diaudit 2026-10-15. Bukti:
  #   - Tidak ada akses config['spread']['by_session'] maupun ['by_news']
  #     di src/, scripts/, tests/ (AST grep).
  #   - Kunci unik blok ini (tokyo_early, tokyo_normal, friday_late,
  #     sunday_open, fomc, cpi, nfp) HANYA muncul di file ini sendiri.
  #   - YANG DIPAKAI: cost_basis.by_session (mean) dan
  #     stress_bands.p95.by_session (p95) - dua blok itu beda letaknya.
  # DIBIARKAN (tidak dihapus) karena blok spread lama memang dijanjikan
  # "TIDAK DIGANTI" - lihat catatan semantika di bawah. Jangan dipakai
  # sebagai sumber angka tanpa definisi sesi; 4 dari 6 kuncinya tidak
  # punya definisi batas jam di src/ sama sekali.
  # Untuk angka stress yang benar-benar terukur, pakai stress_bands
  # (p95 per bar) atau p95_harian (p95 dari mean harian).
  # ===================================================================
  by_session:                 # [DEAD] satuannya pip, absolut - bukan multiplier
    tokyo_early: 3.0          # [DEAD] tidak ada definisi sesi di src/
    tokyo_normal: 1.5         # [DEAD] tidak ada definisi sesi di src/
    london: 1.2               # [DEAD] 1,2 hanya terlampaui 3/825 hari kerja (0,4%)
    newyork: 1.5              # [DEAD] 1,5 hanya terlampaui 17/825 hari kerja (2,1%)
    friday_late: 3.0          # [DEAD] tidak ada definisi sesi di src/
    sunday_open: 5.0          # [DEAD] tidak ada definisi sesi di src/
  by_news:                    # [DEAD] tidak ada konsumen, tidak ada data berita
    fomc: 5.0
    cpi: 3.0
    nfp: 4.0
    boj: 4.0

  # ==================================================================
  # APLIKASI FRAGMEN EDA-02 (disetujui Klenz, 2026-10-06)
  # Sumber angka: reports/eda/2026-10-06/spread_fragment.yaml
  # Angka disalin VERBATIM dari fragmen; tidak ada yang dihitung ulang.
  #
  # SEMANTIKA: blok ini MENAMBAH dua sub-kunci baru. Blok spread lama
  # (default, by_year, stress_multiplier, warn/error_multiplier,
  # by_session, by_news, pip_size) TIDAK DIGANTI dan tetap berdsiri.
  # Kode yang sudah membaca spread.default / spread.by_year TETAP memakai
  # angka yang sekarang (mean terukur, diganti 2026-10-14) - tidak ada
  # angka lama yang masih aktif.
  #
  # KONFLIK 2,3x YANG PERNAH ADA SUDAH HILANG (per 2026-10-15):
  #   dulu  cost_basis.default = 0,65 vs spread.default = 1,5  (beda 2,3x)
  #   kini keduanya 0,65. angka lama spread.default sudah diganti mean
  #   terukur pada 2026-10-14 dan multiplier dikalibrasi ulang.
  # Tetap aturannya: backtest WAJIB menyebut kode mana yang jadi otoritas
  # biaya. spread.default = BASELINE VALIDASI (bukan biaya per trade);
  # biaya per trade = cost_basis (mean) atau stress_bands (p95/p99).
  #
  # TIPE KUNCI TAHUN - TIDAK KONSISTEN, HATI-HATIKAT SAAT AKSES:
  #   spread.by_year              -> int   (2023: 0.51)
  #   cost_basis.by_year          -> str   ('2023': 0.51)
  #   stress_bands.p95/p99.by_year-> str   ('2023': ...)
  # src/data/validate_data.py:276 menormalkan dulu ke str sebelum lookup.
  # PEMAKAI BARU WAJIB: {str(k): v for k, v in ...by_year.items()}
  # atau kuncinya tidak akan pernah ketemu.
  # ==================================================================

  # Biaya dasar = MEAN spread strata A (bukan p95, bukan p99).
  # Dipakai sebagai biaya optimistic dalam backtest.
  #
  # [!] PENTING: ini MEAN POOLED (semua bar x semua hari), BUKAN mean
  #     per hari. Mean pooled > median harian di keempat sesi karena
  #     didominasi beberapa hari ekstrem. Kalau biaya ini dipakai sebagai
  #     "biaya hari yang biasa terjadi", nilainya terlalu mahal - terutama
  #     Sydney (+0,071) dan NewYork (+0,065).
  #     Angka median harian & p95 harian ada di `_ringkasan_harian`.
  #     Rujukan: 825 hari kerja per sesi, stratum A, 2023-2026.
  cost_basis:
    _satuan: pip
    _statistik: MEAN spread_pips strata A (POOLED per bar, bukan per hari)
    default: 0.65
    by_year:
      '2023': 0.51
      '2024': 0.7
      '2025': 0.67
      '2026': 0.62
    by_session:
      London: 0.61
      NewYork: 0.69
      Tokyo: 0.62
      Sydney: 0.8
    # mean pooled vs mean harian, per sesi (dihitung 2026-10-15)
    _ringkasan_harian:
      _satuan: pip
      _metode: 'mean per hari kerja (broker_day, Sen-Jum), dikelompokkan ulang'
      _n_hari_per_sesi: 825
      London:
        mean_pooled: 0.6076
        median_harian: 0.601
        selisih: 0.007
        cv_persen: 17.9
      NewYork:
        mean_pooled: 0.6924
        median_harian: 0.628
        selisih: 0.065
        cv_persen: 39.5
      Tokyo:
        mean_pooled: 0.6151
        median_harian: 0.604
        selisih: 0.012
        cv_persen: 18.0
      Sydney:
        mean_pooled: 0.7959
        median_harian: 0.724
        selisih: 0.071
        cv_persen: 47.0

  # Stress band = ekor spread (p95 untuk stress test, p99 untuk batas ekor).
  # Boleh dikalikan stress_multiplier (tetap 2.0 di bawah).
  stress_bands:
    _satuan: pip
    _catatan: p95 untuk stress test; p99 untuk batas ekor. Boleh dikalikan stress_multiplier.
    p95:
      default: 1.0
      by_year:
        '2023': 0.6
        '2024': 1.2
        '2025': 1.0
        '2026': 0.7
      by_session:
        London: 0.8
        NewYork: 1.2
        Tokyo: 0.9
        Sydney: 1.5
    p99:
      default: 1.6
      by_year:
        '2023': 1.1
        '2024': 1.7
        '2025': 1.7
        '2026': 1.1
    # ---------------------------------------------------------------
    # BARU 2026-10-15. p95 dari MEAN HARIAN, bukan p95 per bar.
    # Untuk meniru "hari spread-nya benar-benar buruk", ini lebih
    # berguna daripada p95 per bar: p95 per bar dijawab 1% bar
    # TERBAIK di hari paling buruk, sedangkan p95_harian dijawab
    # 5% HARI yang benar-benar lebar.
    # Nilai p95/p99/by_session DI ATAS TIDAK DIUBAH - dipakai
    # scripts/archive/eda-06-07 dan _build_eda06.py sbb.
    # ---------------------------------------------------------------
    p95_harian:
      _satuan: pip
      _statistik: p95 dari mean spread per hari kerja (Sen-Jum)
      _n_hari_per_sesi: 825
      _peringatan: 'Inilah angka yang SANGAT menolak klaim "tiap hari
        spread selebar ambang". Contoh NewYork: p95 harian 1,09,
        sedangkan ambang by_session 1,5 hanya terlampaui 2,1% hari.'
      by_session:
        London: 0.77
        NewYork: 1.09
        Tokyo: 0.81
        Sydney: 1.34
  pip_size:
    USDJPY: 0.01
    default: 0.0001

validation:
  max_gap_minutes:
    M1: 5
    M5: 15
    M15: 30
    H1: 120
  max_return_std: 10
  min_rows_per_year: 100000
  # Jendela tempat digit jam broker menyimpang 1 jam dari dominannya
  # (buka 00:00, bukan 01:00). Dipakai check_known_anomalies. Dihapus dari
  # kode supaya bisa diperbarui tanpa menyentuh src/ (RULES.md §10).
  #
  # Temuan self-audit 2026-10-05 (SA-02): digit jamming Mundur 1 jam, jadi
  # ini BUKAN "offset belum terverifikasi" secara netral. Bukti internal
  # (hanya broker_time_raw, tanpa kolom `time` yang kita karunia sendiri):
  #   - di luar jendela, buka sesi = 01:00 -> 22:00 UTC (offset +3) di musim
  #     panas dan 23:00 UTC (offset +2) di musim dingin.
  #   - di dalam jendela, digit 00:00. Dengan offset +3 hasilnya 21:00 UTC,
  #     nilai yang TIDAK PERNAH muncul di 4 tahun selain 19 hari ini.
  #     Dengan offset +2 hasilnya 22:00 UTC, identik dengan tetangganya.
  # Jadi bukti lokal mengarah ke +2, tapi ini tetap inferensi, bukan
  # konfirmasi broker. Menunggu jawaban Finex. Lihat .ai/STATE.md.
  anomaly_windows:
    - start: "2024-10-28"
      end: "2024-11-01"
      note: >-
        Digit jam mundur 1 jam (buka 00:00) selama lima hari perdagangan,
        lalu kembali normal 4 Nov 2024. Offset jendela ini BELUM
        TERVERIFIKASI; jangan dipakai untuk fitur sesi Tokyo/London/NY
        sebelum sebabnya dikonfirmasi ke Finex.
    - start: "2026-03-10"
      end: "2026-03-27"
      note: >-
        Digit jam mundur 1 jam (buka 00:00) selama empat belas hari
        perdagangan, lalu kembali normal 30 Mar 2026. Offset jendela ini
        BELUM TERVERIFIKASI; jangan dipakai untuk fitur sesi Tokyo/London/NY
        sebelum sebabnya dikonfirmasi ke Finex.
