# Konfigurasi data & koneksi MT5
mt5:
  symbol: "USDJPY"
  # VERIFIED 2026-10-05: offset server = +3.00 jam (bukan +2).
  # Bukti: symbol_info_tick().time  05:58:13 vs UTC 02:58:06 -> +3.0019 jam
  #        last M1 bar timestamp    05:58:00 vs UTC 02:58:06 -> +2.9983 jam
  # Dua pengukuran independen, keduanya +3.00.
  #
  # PERINGATAN - offset HISTORIS belum terverifikasi:
  # - 2023-01: tidak ada daily break sama sekali (hanya gap weekend ~48jam).
  # - 2026-03: gap harian muncul di jam server 0 DAN 1 (indikasi transisi).
  # Pola ini TIDAK konsisten dengan offset tetap +3 selama 3.75 tahun.
  # TINDAKAN: fetch_data.py WAJIB menyimpan timestamp broker mentah bersama
  # timestamp UTC, lalu validate_data.py menguji offset terhadap anchor UTC
  # yang dikenal sebelum fitur session dipakai. Jangan percaya nilai ini
  # untuk data sebelum 2023-06 tanpa validasi.
  broker_timezone: "Etc/GMT-3"
  # Digit harga dari symbol_info().digits. Dipakai clean_data.py untuk
  # membulatkan OHLC ke presisi tick. USDJPY = 3 desimal.
  price_digits: 3
  timeframes:
    - M1
    - M5
    - M15
    - M30
    - H1
    - H4
    - D1
  start_date: "2023-01-01"
  end_date: "2026-10-05"
  login: ""
  password: ""
  server: ""

data:
  raw_format: "csv"
  processed_format: "parquet"
  filename_pattern: "{symbol}_{tf}_{year}.{format}"
  # Semua bar disimpan dalam UTC. Kolom broker_time_raw disimpan terpisah
  # supaya konversi bisa diaudit ulang tanpa fetch ulang (RULES.md §20).
  internal_timezone: "UTC"

# SPREAD CONFIG (WAJIB - section 18.16 RULES.md)
# Data OHLC MT5 = BID.
# BUY: entry ask = bid + spread, exit bid.
# SELL: entry bid, exit ask = bid + spread.
# Spread dalam PIP (bukan point).
spread:
  default: 1.5
  # Spread per tahun, dipakai backtest. Diukur dari data M1 2023-2026:
  # median semua tahun 0,6 pip, tapi p99 2023 = 8,5 pip (jauh lebih lebar
  # dari 2024-2026 yang p99 = 1,2-1,7). Likuiditas 2023 lebih tipis, jadi
  # default 1,5 akan terlalu optimis untuk tahun itu.
  # Diukur 2026-10-05 dari data/raw/M1/.
  by_year:
    2023: 3.0
    2024: 1.5
    2025: 1.5
    2026: 1.5
  # Kalau ini dipakai, spread harus dikalikan stress_multiplier.
  stress_multiplier: 2.0
  # check_spread membandingkan p99 terukur terhadap by_year di atas.
  # p99 > by_year x warn_multiplier  -> WARN
  # p99 > by_year x error_multiplier -> ERROR
  warn_multiplier: 2.0
  error_multiplier: 5.0
  by_session:
    tokyo_early: 3.0
    tokyo_normal: 1.5
    london: 1.2
    newyork: 1.5
    friday_late: 3.0
    sunday_open: 5.0
  by_news:
    fomc: 5.0
    cpi: 3.0
    nfp: 4.0
    boj: 4.0
  pip_size:
    USDJPY: 0.01
    default: 0.0001

validation:
  max_gap_minutes:
    M1: 5
    M5: 15
    M15: 30
    H1: 120
  max_return_std: 10
  min_rows_per_year: 100000
  # Jendela tempat jam break broker menyimpang dari nilai dominannya.
  # Dipakai check_known_anomalies. Dihapus dari kode supaya bisa diperbarui
  # tanpa menyentuh src/ (RULES.md §10).
  anomaly_windows:
    - start: "2024-10-29"
      end: "2024-11-01"
      note: "break harian di jam dinding 3, bukan 4"
    - start: "2026-03-10"
      end: "2026-03-27"
      note: "break harian di jam dinding 3, bukan 4"
