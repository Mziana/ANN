[project]
name = "usdjpy-bot"
version = "0.1.0"
description = "USDJPY trading bot berbasis ANN + rule-based hybrid"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# `reports/research/` = arsip evidence yang SUDAH dijalankan + diaudit.
# Jangan di-lint/format: mengubahnya AFTER-the-fact merusak seal artefak.
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".ipynb_checkpoints",
    "reports/research",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# `import MetaTrader5 as mt5` follows the vendor's documented convention.
"src/data/fetch_data.py" = ["N813"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: test yang lambat",
    "integration: test integrasi",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
